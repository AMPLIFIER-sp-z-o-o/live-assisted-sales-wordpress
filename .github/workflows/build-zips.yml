# Builds the installable ZIPs on every push and publishes them as workflow artifacts, so the file
# handed to the wordpress.org reviewers (or uploaded manually to a store) is always the one built
# from the exact commit - never a stale copy from someone's local dist/.
#
# Where to download:
#   - stable, no login (linked from the README for merchants):
#     https://github.com/AMPLIFIER-sp-z-o-o/live-assisted-sales-wordpress/releases/download/latest/amper-live-assisted-sales.zip
#     (the rolling "latest" release below, refreshed on every push to main)
#   - per-commit: GitHub -> Actions -> "Build plugin ZIPs" run -> Artifacts.

name: Build plugin ZIPs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build all ZIP variants
        run: ./build-zip.sh

      - name: Upload the wordpress.org submission ZIP
        uses: actions/upload-artifact@v4
        with:
          name: amper-live-assisted-sales-wporg
          path: dist/amper-live-assisted-sales-wporg.zip

      - name: Upload the GitHub-distributed ZIP (manual installs)
        uses: actions/upload-artifact@v4
        with:
          name: amper-live-assisted-sales
          path: dist/amper-live-assisted-sales.zip

      # Keeps a login-free, stable download URL for merchants. The tag "latest" deliberately does
      # not match the v* pattern of deploy-wporg.yml, so refreshing it never touches SVN. The tag
      # is moved to the built commit first so the release's "Source code" links stay honest.
      - name: Refresh the rolling "latest" release (stable download link)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Latest build" \
            --notes "Rolling release: always the ZIP built from the current main. Install via Plugins -> Add New -> Upload Plugin."
          gh release upload latest dist/amper-live-assisted-sales.zip --clobber
