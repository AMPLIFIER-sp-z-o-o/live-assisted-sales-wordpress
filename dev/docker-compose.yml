name: amper-las-wp

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8003:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - ../plugin/amper-live-assisted-sales:/var/www/html/wp-content/plugins/amper-live-assisted-sales
    extra_hosts:
      - "host.docker.internal:host-gateway"

  wpcli:
    image: wordpress:cli-php8.3
    # The Debian wordpress image owns files as uid 33; the Alpine cli image's www-data
    # is uid 82 - run as 33 so wp-cli can write plugins/uploads/languages.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
      - ../plugin/amper-live-assisted-sales:/var/www/html/wp-content/plugins/amper-live-assisted-sales
      - ./provision.sh:/provision.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["tools"]

volumes:
  db_data:
  wp_data:
